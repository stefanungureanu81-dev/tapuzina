{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <div class="card-body">
                <h2 class="mb-4"><i class="fas fa-edit text-gradient me-2"></i>Editeaza firma</h2>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Nume firma *</label>
                        <input type="text" name="name" class="form-control" value="{{ company.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CUI / CNP</label>
                        <input type="text" name="cui" class="form-control" value="{{ company.cui }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Adresa</label>
                        <textarea name="address" class="form-control" rows="2">{{ company.address }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Persoana contact</label>
                            <input type="text" name="contact_person" class="form-control" value="{{ company.contact_person }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Telefon</label>
                            <input type="text" name="contact_phone" class="form-control" value="{{ company.contact_phone }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email contact</label>
                        <input type="email" name="contact_email" class="form-control" value="{{ company.contact_email }}">
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" name="is_active" class="form-check-input" id="isActive" {% if company.is_active %}checked{% endif %}>
                            <label class="form-check-label" for="isActive">Firma activa</label>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Salveaza
                        </button>
                        <a href="{% url 'admin_companies' %}" class="btn btn-secondary">
                            <i class="fas fa-times me-2"></i>Anuleaza
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
