{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <div class="card-body">
                <h2 class="mb-4"><i class="fas fa-key text-gradient me-2"></i>Resetare parola</h2>
                <p class="text-muted">Reseteaza parola pentru <strong>{{ user.username }}</strong> ({{ user.email }})</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Parola noua *</label>
                        <input type="text" name="new_password" class="form-control" required minlength="6" placeholder="Introduceti parola noua (min 6 caractere)">
                        <small class="text-muted">Parola va fi trimisa pe emailul utilizatorului.</small>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="fas fa-key me-2"></i>Reseteaza si trimite email
                        </button>
                        <a href="{% url 'edit_user' user.id %}" class="btn btn-secondary">
                            <i class="fas fa-times me-2"></i>Anuleaza
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
