
{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="fas fa-user-plus fa-3x text-gradient"></i>
                    <h2 class="mt-3 fw-bold">Creare cont</h2>
                    <p class="text-muted">Inregistrati-va pentru a face programari</p>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-user-plus me-2"></i>Inregistrare
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <p>Ai cont? <a href="{% url 'login' %}">Autentifica-te</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
<style>.form-control{margin-bottom:10px;}label{font-weight:600;}</style>
{% endblock %}
