{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <div class="card-body">
                <h2 class="mb-4"><i class="fas fa-user-edit text-gradient me-2"></i>Editeaza utilizator</h2>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Username *</label>
                            <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Prenume</label>
                            <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nume</label>
                            <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" name="is_active" class="form-check-input" id="isActive" {% if user.is_active %}checked{% endif %}>
                            <label class="form-check-label" for="isActive">Cont activ</label>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Salveaza
                        </button>
                        <a href="{% url 'admin_users' %}" class="btn btn-secondary">
                            <i class="fas fa-times me-2"></i>Anuleaza
                        </a>
                    </div>
                </form>
                
                <hr class="my-4">
                <div class="mt-3">
                    <h5><i class="fas fa-key text-warning me-2"></i>Resetare parola</h5>
                    <p class="text-muted small">Trimite un email cu o parola noua pentru utilizator.</p>
                    <a href="{% url 'reset_password' user.id %}" class="btn btn-warning">
                        <i class="fas fa-key me-2"></i>Reseteaza parola
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
