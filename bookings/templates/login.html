{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; background-image: url('https://res.cloudinary.com/tpolhmze/image/upload/v1788935538/tapuzina/services/j1wroko4omf8m6ufvati.png'); background-size: cover; background-position: center; background-attachment: fixed;">
    <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); z-index: 1;"></div>
</div>

<div class="container" style="position: relative; z-index: 2; min-height: 100vh; display: flex; align-items: center; padding: 20px 0;">
    <div class="row align-items-center" style="width: 100%;">
        <div class="col-md-6">
            <div class="card p-4" style="background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); border: none; box-shadow: 0 15px 50px rgba(0,0,0,0.3);">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="fas fa-spa fa-3x text-gradient"></i>
                        <h2 class="mt-3 fw-bold">Bun venit la Tapuzina.ro</h2>
                        <p class="text-muted">Autentifica-te pentru a face o programare</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-user me-2"></i>Nume utilizator</label>
                            <input type="text" name="username" class="form-control" required placeholder="Introduceti numele de utilizator">
                        </div>
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-lock me-2"></i>Parola</label>
                            <input type="password" name="password" class="form-control" required placeholder="Introduceti parola">
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt me-2"></i>Autentificare</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="mb-1">Nu ai cont?</p>
                        <a href="{% url 'register' %}" class="btn btn-outline-primary"><i class="fas fa-user-plus me-2"></i>Inregistreaza-te</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-3" style="background: rgba(255,255,255,0.88); backdrop-filter: blur(5px); border: none; box-shadow: 0 15px 50px rgba(0,0,0,0.2);">
                <div class="card-body text-center">
                    <h4 class="mb-3"><i class="fas fa-play-circle text-primary me-2"></i>Descopera Tapuzina.ro</h4>
                    <video class="hero-video" autoplay muted loop playsinline controls style="border-radius:15px;width:100%;max-height:350px;object-fit:cover;box-shadow:0 5px 20px rgba(0,0,0,0.1);background:#000;">
                        <source src="https://res.cloudinary.com/tpolhmze/video/upload/v1788935544/tapuzina/video/h5tztw0s5vqpqwzcf0fr.mp4" type="video/mp4">
                        <p>Browserul tau nu suporta video-uri.</p>
                    </video>
                    <p class="mt-3 text-muted">Masaj profesional la birou sau acasa</p>
                    <div class="mt-2">
                        <span class="badge bg-pink me-1" style="background:#e91e63;color:white;">La Birou</span>
                        <span class="badge bg-purple me-1" style="background:#9c27b0;color:white;">La Sediu</span>
                        <span class="badge bg-info">La Domiciliu</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.text-gradient {
    background: linear-gradient(135deg, #e91e63 0%, #9c27b0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.hero-video {
    border-radius: 15px;
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    background: #000;
}
.card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.25) !important;
}
</style>
{% endblock %}
